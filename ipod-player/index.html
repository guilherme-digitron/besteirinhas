<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tocador</title>
<meta name="theme-color" content="#101219">
<meta name="color-scheme" content="dark">
<meta name="description" content="Player de áudio para ouvir playlists e podcasts direto do navegador.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101219'/%3E%3Crect x='9' y='7' width='3' height='18' rx='1.5' fill='%238E9CFF'/%3E%3Crect x='15' y='11' width='3' height='10' rx='1.5' fill='%23ECE9E3'/%3E%3Crect x='21' y='9' width='3' height='14' rx='1.5' fill='%23ECE9E3'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#101219;
    --ink-2:#161926;
    --ink-3:#1E2231;
    --line:#282D3E;
    --paper:#ECE9E3;
    --muted:#8B90A6;
    --accent:#8E9CFF;
    --accent-dim:#3A4173;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --bar-h:96px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink); color:var(--paper);
    font-family:var(--sans); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom));
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

  .wrap{max-width:860px;margin:0 auto;padding:0 24px}

  /* ---------- topo ---------- */
  .top{display:flex;align-items:center;gap:16px;padding:22px 0 0}
  .mark{display:flex;align-items:center;gap:9px;font-size:13px;letter-spacing:.02em;color:var(--muted)}
  .mark i{display:block;width:3px;height:16px;background:var(--accent);border-radius:2px}
  .top .spacer{flex:1}
  .ghost{
    border:1px solid var(--line);border-radius:999px;padding:7px 14px;
    font-size:13px;color:var(--paper);transition:border-color .15s,background .15s
  }
  .ghost:hover{border-color:var(--accent);background:var(--ink-2)}

  /* ---------- cabeçalho da playlist ---------- */
  .head{padding:40px 0 26px;border-bottom:1px solid var(--line)}
  .head h1{
    font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,46px);
    line-height:1.12;margin:0 0 10px;letter-spacing:-.01em
  }
  .meta{font-size:13.5px;color:var(--muted)}
  .picker{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted)
  }
  .chip:hover{color:var(--paper);border-color:var(--muted)}
  .chip[aria-current="true"]{color:var(--ink);background:var(--paper);border-color:var(--paper)}

  /* ---------- lista ---------- */
  ol.tracks{list-style:none;margin:0;padding:0}
  .row{
    position:relative;width:100%;text-align:left;display:grid;
    grid-template-columns:34px 1fr auto;align-items:baseline;gap:14px;
    padding:15px 12px 16px;border-bottom:1px solid var(--line);
    border-radius:6px;transition:background .15s
  }
  .row:hover{background:var(--ink-2)}
  .row .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .row .t{font-family:var(--serif);font-size:17.5px;line-height:1.35}
  .row .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .row .heard{
    position:absolute;left:12px;right:12px;bottom:6px;height:2px;background:var(--accent-dim);
    transform-origin:left;border-radius:2px
  }
  .row[data-state="playing"] .t,.row[data-state="playing"] .n{color:var(--accent)}
  .row[data-state="done"] .t{color:var(--muted)}
  .row[data-state="done"] .n::after{content:"✓";margin-left:2px}

  /* ---------- vazio ---------- */
  .empty{padding:56px 0 40px;max-width:46ch}
  .empty h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 12px}
  .empty p{color:var(--muted);font-size:14.5px;margin:0 0 10px}
  .empty ol{color:var(--muted);font-size:14.5px;padding-left:18px;margin:14px 0}
  .empty code{background:var(--ink-3);padding:1px 6px;border-radius:4px;color:var(--paper);font-size:13px}
  .solid{
    margin-top:18px;background:var(--paper);color:var(--ink);border-radius:999px;
    padding:11px 22px;font-size:14.5px;font-weight:500
  }
  .solid:hover{background:#fff}

  /* ---------- barra do tocador ---------- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:5;
    background:rgba(16,18,25,.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)
  }
  .bar .wrap{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:center;padding-top:12px;padding-bottom:12px}
  .now{min-width:0}
  .now .t{font-family:var(--serif);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrls{display:flex;align-items:center;gap:6px}
  .ctrls button{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    color:var(--muted);transition:color .15s,background .15s
  }
  .ctrls button:hover{color:var(--paper);background:var(--ink-3)}
  .ctrls .play{width:46px;height:46px;background:var(--paper);color:var(--ink)}
  .ctrls .play:hover{background:#fff;color:var(--ink)}
  .rate{width:auto!important;padding:0 10px;border-radius:999px!important;font-size:12.5px;font-variant-numeric:tabular-nums}
  svg{display:block;fill:currentColor}

  .seek{grid-column:1/-1;display:flex;align-items:center;gap:12px}
  .seek .time{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px}
  .seek .time.r{text-align:right}
  .track{
    position:relative;flex:1;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none
  }
  .track .rail{width:100%;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
  .track .fill{height:100%;width:0;background:var(--accent);border-radius:3px}
  .track .knob{
    position:absolute;top:50%;left:0;width:11px;height:11px;margin-left:-5.5px;
    border-radius:50%;background:var(--paper);transform:translateY(-50%) scale(0);
    transition:transform .12s
  }
  .track:hover .knob,.track.dragging .knob{transform:translateY(-50%) scale(1)}

  .vol{display:flex;align-items:center;gap:8px;color:var(--muted)}
  .vol input{width:78px;accent-color:var(--accent);background:transparent}

  @media (max-width:720px){
    :root{--bar-h:118px}
    .wrap{padding:0 18px}
    .head{padding:28px 0 20px}
    .row{grid-template-columns:26px 1fr auto;gap:10px;padding:13px 8px 15px}
    .row .t{font-size:16px}
    .row .heard{left:8px;right:8px}
    .vol{display:none}
    .bar .wrap{grid-template-columns:1fr auto}
    .ctrls .skip{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <span class="mark"><i></i>Tocador</span>
    <span class="spacer"></span>
    <button class="ghost" id="openBtn">Abrir pasta</button>
  </div>

  <main id="main"></main>
</div>

<div class="bar" hidden id="bar">
  <div class="wrap">
    <div class="now">
      <div class="t" id="nowTitle">—</div>
      <div class="s" id="nowSub"></div>
    </div>
    <div class="ctrls">
      <button id="prev" title="Anterior"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2h2v12H4zM14 2v12L6 8z"/></svg></button>
      <button class="skip" id="back15" title="Voltar 15 s"><svg width="17" height="17" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16" font-size="8" text-anchor="middle" fill="currentColor" font-family="sans-serif">15</text></svg></button>
      <button class="play" id="play" title="Tocar"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg></button>
      <button class="skip" id="fwd30" title="Avançar 30 s"><svg width="17" height="17" viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16" font-size="8" text-anchor="middle" fill="currentColor" font-family="sans-serif">30</text></svg></button>
      <button id="next" title="Próxima"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M12 2h-2v12h2zM2 2v12l8-6z"/></svg></button>
      <button class="rate" id="rate" title="Velocidade">1×</button>
      <span class="vol">
        <svg width="15" height="15" viewBox="0 0 16 16"><path d="M7 2L4 5H1v6h3l3 3zM10.5 5.5a3.5 3.5 0 0 1 0 5v-5z"/></svg>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </span>
    </div>
    <div class="seek">
      <span class="time" id="cur">0:00</span>
      <div class="track" id="track" role="slider" tabindex="0" aria-label="Posição" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="rail"><div class="fill" id="fill"></div></div>
        <div class="knob" id="knob"></div>
      </div>
      <span class="time r" id="dur">0:00</span>
    </div>
  </div>
</div>

<input type="file" id="folder" webkitdirectory directory multiple accept="audio/*" hidden>
<audio id="audio" preload="metadata"></audio>

<script src="data.js" onerror="void 0"></script>
<script>
(function(){
  "use strict";

  var audio = document.getElementById('audio');
  var main  = document.getElementById('main');
  var bar   = document.getElementById('bar');
  var lists = [];          // [{name, tracks:[{title, src, dur}]}]
  var li = 0, ti = -1;     // playlist / faixa atuais
  var rates = [1, 1.25, 1.5, 1.75, 2], ri = 0;

  /* ---------- memória de progresso ---------- */
  var store = {
    get: function(k){ try { return JSON.parse(localStorage.getItem('tocador:' + k)) || null; } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem('tocador:' + k, JSON.stringify(v)); } catch(e){} }
  };
  function key(l,t){ return lists[l].name + '|' + lists[l].tracks[t].title; }

  /* ---------- utilidades ---------- */
  function hhmmss(s){
    if(!isFinite(s) || s < 0) return '0:00';
    s = Math.floor(s);
    var h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
    return h ? h + ':' + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0')
             : m + ':' + String(x).padStart(2,'0');
  }
  function longTime(s){
    if(!isFinite(s) || s <= 0) return '';
    var h = Math.floor(s/3600), m = Math.round(s%3600/60);
    return (h ? h + ' h ' : '') + m + ' min';
  }
  function clean(name){
    return name.replace(/\.(mp3|m4a|ogg|wav|flac|aac|opus|webm)$/i,'')
               .replace(/_/g,':').replace(/\s+/g,' ').trim();
  }
  function natural(a,b){ return a.localeCompare(b, 'pt-BR', {numeric:true, sensitivity:'base'}); }

  /* ---------- carregar dados ---------- */
  function fromData(){
    var d = window.PLAYLISTS;
    if(!d || !d.length) return false;
    lists = d.map(function(p){
      return {
        name: p.name,
        tracks: (p.tracks||[]).map(function(t){
          var src = typeof t === 'string' ? t : t.src;
          var title = typeof t === 'string' ? clean(src.split('/').pop()) : (t.title || clean(src.split('/').pop()));
          return { title: title, src: src.split('/').map(encodeURIComponent).join('/'), dur: 0 };
        })
      };
    }).filter(function(p){ return p.tracks.length; });
    return lists.length > 0;
  }

  function fromFiles(files){
    var byFolder = {};
    Array.prototype.forEach.call(files, function(f){
      if(!/\.(mp3|m4a|ogg|wav|flac|aac|opus|webm)$/i.test(f.name)) return;
      var path = (f.webkitRelativePath || f.name).split('/');
      var folder = path.length > 1 ? path[path.length-2] : 'Suas músicas';
      (byFolder[folder] = byFolder[folder] || []).push(f);
    });
    var names = Object.keys(byFolder).sort(natural);
    if(!names.length) return false;
    lists = names.map(function(n){
      return {
        name: n,
        tracks: byFolder[n].sort(function(a,b){ return natural(a.name,b.name); }).map(function(f){
          return { title: clean(f.name), src: URL.createObjectURL(f), dur: 0 };
        })
      };
    });
    return true;
  }

  /* ---------- telas ---------- */
  function renderEmpty(){
    bar.hidden = true;
    var hosted = location.protocol.indexOf('http') === 0;
    main.innerHTML =
      '<div class="empty">' +
        '<h2>Nenhuma playlist carregada</h2>' +
        (hosted
          ? '<p>O site não encontrou o <code>data.js</code>. Ele é gerado a partir da pasta ' +
            '<code>playlists</code>: rode <code>python gerar-dados.py</code> e publique o arquivo junto, ' +
            'ou deixe a Action do repositório gerar isso a cada push.</p>' +
            '<p>Enquanto isso, você pode tocar áudios do seu próprio computador:</p>'
          : '<p>Abrir o arquivo direto do disco impede o navegador de ler <code>manifest.json</code>. ' +
            'Este tocador contorna isso de duas formas:</p>' +
            '<ol>' +
              '<li>Rode <code>python gerar-dados.py</code> na pasta do projeto para criar o ' +
              '<code>data.js</code>. Depois é só abrir esta página e tudo carrega sozinho.</li>' +
              '<li>Ou clique abaixo e escolha a pasta <code>playlists</code>. Vale só para esta sessão.</li>' +
            '</ol>') +
        '<button class="solid" id="openBtn2">Escolher uma pasta</button>' +
      '</div>';
    document.getElementById('openBtn2').onclick = pickFolder;
  }

  function renderList(){
    bar.hidden = false;
    var pl = lists[li];
    var total = pl.tracks.reduce(function(a,t){ return a + (t.dur||0); }, 0);

    var chips = lists.length > 1
      ? '<div class="picker">' + lists.map(function(p,i){
          return '<button class="chip" data-pl="' + i + '" aria-current="' + (i===li) + '">' + esc(p.name) + '</button>';
        }).join('') + '</div>'
      : '';

    var rows = pl.tracks.map(function(t,i){
      var saved = store.get(key(li,i)) || {};
      var frac = saved.done ? 1 : (t.dur && saved.t ? Math.min(saved.t/t.dur,1) : 0);
      var state = i === ti ? 'playing' : (saved.done ? 'done' : '');
      return '<li><button class="row" data-i="' + i + '" data-state="' + state + '">' +
               '<span class="n">' + String(i+1).padStart(2,'0') + '</span>' +
               '<span class="t">' + esc(t.title) + '</span>' +
               '<span class="d">' + (t.dur ? hhmmss(t.dur) : '·') + '</span>' +
               (frac > 0.01 ? '<span class="heard" style="transform:scaleX(' + frac.toFixed(3) + ')"></span>' : '') +
             '</button></li>';
    }).join('');

    main.innerHTML =
      '<header class="head"><h1>' + esc(pl.name) + '</h1>' +
        '<div class="meta">' + pl.tracks.length + (pl.tracks.length===1?' faixa':' faixas') +
        (total ? ', ' + longTime(total) : '') + '</div>' + chips +
      '</header><ol class="tracks">' + rows + '</ol>';

    main.querySelectorAll('.row').forEach(function(b){
      b.onclick = function(){ var i = +b.dataset.i; (i === ti) ? toggle() : load(li, i, true); };
    });
    main.querySelectorAll('.chip').forEach(function(b){
      b.onclick = function(){ li = +b.dataset.pl; measure(); renderList(); };
    });
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  /* ---------- durações (lidas em segundo plano) ---------- */
  function measure(){
    var pl = lists[li], pending = pl.tracks.filter(function(t){ return !t.dur; });
    if(!pending.length) return;
    var i = 0;
    (function nextOne(){
      if(i >= pending.length){ renderList(); return; }
      var t = pending[i++], probe = new Audio();
      var go = function(){ probe.src = ''; nextOne(); };
      probe.preload = 'metadata';
      probe.onloadedmetadata = function(){ t.dur = probe.duration || 0; go(); };
      probe.onerror = go;
      probe.src = t.src;
    })();
  }

  /* ---------- tocar ---------- */
  function load(l, t, play){
    li = l; ti = t;
    var tr = lists[l].tracks[t];
    audio.src = tr.src;
    audio.playbackRate = rates[ri];
    var saved = store.get(key(l,t));
    if(saved && saved.t > 5 && (!tr.dur || saved.t < tr.dur - 10)) audio.currentTime = saved.t;
    document.getElementById('nowTitle').textContent = tr.title;
    document.getElementById('nowSub').textContent = lists[l].name;
    document.title = tr.title + ' — Tocador';
    media(tr.title, lists[l].name);
    if(play) audio.play().catch(function(){});
    renderList();
  }
  function toggle(){ audio.paused ? audio.play().catch(function(){}) : audio.pause(); }
  function step(d){ if(isFinite(audio.duration)) audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + d)); }
  function jump(d){
    var n = ti + d;
    if(n >= 0 && n < lists[li].tracks.length) load(li, n, true);
  }

  var playIcon = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>';
  var pauseIcon = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>';
  var playBtn = document.getElementById('play');

  audio.addEventListener('play', function(){ playBtn.innerHTML = pauseIcon; playBtn.title = 'Pausar'; });
  audio.addEventListener('pause', function(){ playBtn.innerHTML = playIcon; playBtn.title = 'Tocar'; save(); });
  audio.addEventListener('loadedmetadata', function(){
    document.getElementById('dur').textContent = hhmmss(audio.duration);
    if(ti > -1 && !lists[li].tracks[ti].dur) lists[li].tracks[ti].dur = audio.duration;
  });
  audio.addEventListener('timeupdate', function(){
    var p = audio.duration ? audio.currentTime / audio.duration : 0;
    if(!dragging) paint(p);
    document.getElementById('cur').textContent = hhmmss(audio.currentTime);
    if(Math.floor(audio.currentTime) % 5 === 0) save();
  });
  audio.addEventListener('ended', function(){
    if(ti > -1) store.set(key(li,ti), {t:0, done:true});
    if(ti < lists[li].tracks.length - 1) load(li, ti+1, true); else renderList();
  });
  function save(){
    if(ti < 0 || !audio.duration) return;
    var done = audio.currentTime > audio.duration - 15;
    store.set(key(li,ti), {t: done ? 0 : audio.currentTime, done: done});
  }
  window.addEventListener('beforeunload', save);

  /* ---------- barra de posição ---------- */
  var track = document.getElementById('track'), fill = document.getElementById('fill'),
      knob = document.getElementById('knob'), dragging = false;
  function paint(p){
    p = Math.max(0, Math.min(1, p || 0));
    fill.style.width = (p*100) + '%';
    knob.style.left = (p*100) + '%';
    track.setAttribute('aria-valuenow', Math.round(p*100));
  }
  function seekFrom(e){
    var r = track.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var p = Math.max(0, Math.min(1, x / r.width));
    paint(p);
    return p;
  }
  function down(e){ if(!audio.duration) return; dragging = true; track.classList.add('dragging'); seekFrom(e); e.preventDefault(); }
  function move(e){ if(dragging) seekFrom(e); }
  function up(e){
    if(!dragging) return;
    dragging = false; track.classList.remove('dragging');
    audio.currentTime = seekFrom(e.changedTouches ? {clientX: e.changedTouches[0].clientX} : e) * audio.duration;
  }
  track.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  track.addEventListener('touchstart', down, {passive:false});
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('touchend', up);
  track.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight'){ step(5); e.preventDefault(); }
    if(e.key === 'ArrowLeft'){ step(-5); e.preventDefault(); }
  });

  /* ---------- controles ---------- */
  playBtn.onclick = toggle;
  document.getElementById('prev').onclick = function(){ (audio.currentTime > 3) ? (audio.currentTime = 0) : jump(-1); };
  document.getElementById('next').onclick = function(){ jump(1); };
  document.getElementById('back15').onclick = function(){ step(-15); };
  document.getElementById('fwd30').onclick = function(){ step(30); };
  var rateBtn = document.getElementById('rate');
  rateBtn.onclick = function(){
    ri = (ri + 1) % rates.length;
    audio.playbackRate = rates[ri];
    rateBtn.textContent = String(rates[ri]).replace('.', ',') + '×';
  };
  document.getElementById('vol').oninput = function(){ audio.volume = +this.value; };

  document.addEventListener('keydown', function(e){
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target === track) return;
    if(e.code === 'Space'){ toggle(); e.preventDefault(); }
    else if(e.key === 'ArrowRight'){ step(e.shiftKey ? 60 : 30); }
    else if(e.key === 'ArrowLeft'){ step(e.shiftKey ? -60 : -15); }
    else if(e.key === 'j'){ jump(1); }
    else if(e.key === 'k'){ jump(-1); }
  });

  /* ---------- controles do sistema (tela de bloqueio) ---------- */
  function media(title, album){
    if(!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: album, album: album });
    } catch(e){}
  }
  if('mediaSession' in navigator){
    var acts = {
      play: function(){ audio.play().catch(function(){}); },
      pause: function(){ audio.pause(); },
      previoustrack: function(){ jump(-1); },
      nexttrack: function(){ jump(1); },
      seekbackward: function(d){ step(-(d && d.seekOffset || 15)); },
      seekforward: function(d){ step(d && d.seekOffset || 30); },
      seekto: function(d){ if(d.fastSeek && audio.fastSeek) audio.fastSeek(d.seekTime); else audio.currentTime = d.seekTime; }
    };
    Object.keys(acts).forEach(function(a){
      try { navigator.mediaSession.setActionHandler(a, acts[a]); } catch(e){}
    });
  }

  /* ---------- abrir pasta ---------- */
  var folder = document.getElementById('folder');
  function pickFolder(){ folder.click(); }
  document.getElementById('openBtn').onclick = pickFolder;
  folder.addEventListener('change', function(){
    if(fromFiles(this.files)){ li = 0; ti = -1; renderList(); measure(); }
  });
  ['dragover','drop'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); });
  });
  document.addEventListener('drop', function(e){
    var fs = e.dataTransfer && e.dataTransfer.files;
    if(fs && fs.length && fromFiles(fs)){ li = 0; ti = -1; renderList(); measure(); }
  });

  /* ---------- início ---------- */
  function boot(){
    if(fromData()){ renderList(); measure(); }
    else renderEmpty();
  }
  if(location.protocol.indexOf('http') === 0 && !window.PLAYLISTS){
    fetch('playlists/manifest.json')
      .then(function(r){ return r.json(); })
      .then(function(j){ window.PLAYLISTS = Array.isArray(j) ? j : (j.playlists || []); })
      .catch(function(){})
      .then(boot);
  } else boot();
})();
</script>
</body>
</html>
